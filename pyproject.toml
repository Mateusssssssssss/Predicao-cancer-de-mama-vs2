[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "breast-cancer-classification"
version = "0.1.0"
description = "Reproducible benign/malignant breast tumor classification project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "joblib>=1.3",
  "matplotlib>=3.7",
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "seaborn>=0.13",
  "xgboost>=2.0",
]

[project.optional-dependencies]
notebooks = ["jupyterlab>=4.0", "ipykernel>=6.25"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
